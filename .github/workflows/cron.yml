name: hotel-bargain cron

# VercelのHobbyプランはCron Jobsが「1日1回まで」に制限されているため、
# 3時間おきの価格取得・Deal判定はGitHub Actionsから叩く。
#
# fetch-prices は「チェックイン日1日分だけ」を1リクエストで処理する設計
# （ホテル数が増えるとVercelの関数実行時間上限に収まらなくなるため）。
# 直近1〜14日分をこのワークフロー側でループして呼び出す。
#
# 事前に以下を設定しておくこと:
#   - リポジトリの Variables: APP_BASE_URL（例: https://hotel-bargain.vercel.app）
#   - リポジトリの Secrets:   CRON_SECRET（Vercel側の環境変数と同じ値）
on:
  schedule:
    - cron: "0 */3 * * *" # fetch-prices
    - cron: "30 */3 * * *" # detect-deals
  workflow_dispatch: {} # 手動実行用

jobs:
  fetch-prices:
    if: github.event.schedule == '0 */3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call fetch-prices for each of the next 14 days
        run: |
          for day in $(seq 1 14); do
            echo "=== day $day ==="
            curl -sf -X GET "${{ vars.APP_BASE_URL }}/api/cron/fetch-prices?day=${day}" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
            echo
          done

  detect-deals:
    if: github.event.schedule == '30 */3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Call detect-deals
        run: |
          curl -sf -X GET "${{ vars.APP_BASE_URL }}/api/cron/detect-deals" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
